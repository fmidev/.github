name: Promote an existing version to OpenShift

# Deploys a version that has already been built and published by
# 'openshift-deploy.yaml' to one or more environments, by updating the version
# references in the OpenShift GitOps repository.
#
# Nothing is rebuilt: the container image and the Helm chart for
# APPLICATION_VERSION are expected to be in the registry already. This is the
# difference to 'openshift-deploy.yaml', which builds and then deploys whatever
# the triggering ref points at.
#
# Use this for environments that must not be deployed automatically on a tag
# push, such as production. Call it from a 'workflow_dispatch' workflow so that
# the version can be picked in the GitHub web UI.
#
# The version is verified to exist in the registry before GitOps is touched, and
# a Slack message is posted afterwards when the SLACK_WEBHOOK_URL secret is
# available.

on:
  workflow_call:
    inputs:
      APPLICATION_NAME:
        description: >-
          Application name. Also the directory name looked up under
          DEPLOY_CONFIG_REPOSITORY_BASE_PATH in the GitOps repository.
        default: '${{ github.event.repository.name }}'
        required: false
        type: string
      APPLICATION_VERSION:
        description: 'The already-published version to promote, in SemVer format'
        required: true
        type: string
      HELM_CHART_NAME:
        description: >-
          Name of the published Helm chart, as it exists in the OCI registry.
          Defaults to '<APPLICATION_NAME>-chart', which is what
          'helm-build-and-publish-to-oci-repo.yaml' pushes for the conventional
          'conf/helm' layout.
        default: ''
        required: false
        type: string
      HELM_CHART_KEY:
        description: >-
          Top-level key read from values.yaml in the GitOps repository. Defaults
          to HELM_CHART_NAME, and through it to '<APPLICATION_NAME>-chart'. Set
          both when the published chart name and the values key differ, as they
          do when an umbrella chart references the chart under a dependency
          alias.
        default: ''
        required: false
        type: string
      HELM_VERSION:
        default: 'v3.22.1'
        required: false
        type: string
      APPLICATION_DISPLAY_NAME:
        description: >-
          Name of the application in the Slack message, when it is known by a
          different name than APPLICATION_NAME. Defaults to APPLICATION_NAME.
        default: ''
        required: false
        type: string
      CHANGE_DESCRIPTION:
        description: 'Free-form description of the change, for the Slack message'
        default: ''
        required: false
        type: string
      JIRA_ISSUE:
        description: "Jira issue key of the change, e.g. 'PAK-1234', linked in the Slack message"
        default: ''
        required: false
        type: string
      JIRA_BASE_URL:
        description: 'Base URL of the Jira instance the issue key is linked to'
        default: 'https://jira.fmi.fi'
        required: false
        type: string
      GITHUB_ISSUE:
        description: >-
          GitHub issue of the change, linked in the Slack message: an issue
          number in the calling repository, e.g. '123', or the full URL of an
          issue in any repository on this GitHub instance.
        default: ''
        required: false
        type: string
      SLACK_MESSAGE:
        description: >-
          Legacy: a message posted verbatim instead of the composed one, which
          links the version, the person and the issues. Prefer
          APPLICATION_DISPLAY_NAME and CHANGE_DESCRIPTION. Posted only when the
          SLACK_WEBHOOK_URL secret is available.
        default: ''
        required: false
        type: string
      IMAGE_REGISTRY:
        default: 'quay.io'
        required: false
        type: string
      IMAGE_REGISTRY_NAMESPACE:
        default: 'fmi'
        required: false
        type: string
      IMAGE_TAG_PREFIX:
        default: ''
        required: false
        type: string
      IMAGE_TAG_SUFFIX:
        default: ''
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY:
        default: 'fmidev/openshift-apps-gitops'
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY_SERVER_URL:
        default: 'https://github.com'
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY_BRANCH:
        default: 'main'
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY_BASE_PATH:
        default: '.'
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY_ENVIRONMENTS:
        default: 'production'
        required: false
        type: string
    secrets:
      IMAGE_REGISTRY_USER:
        required: true
      IMAGE_REGISTRY_TOKEN:
        required: true
      DEPLOY_CONFIG_REPOSITORY_SSH_PRIVATE_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        description: 'When set, the promotion is announced in Slack. Skipped when empty.'
        required: false

permissions:
  contents: read

jobs:
  # Composes the Slack message in a job of its own, which holds no secrets:
  # the runner drops a job output containing the value of a secret it knows,
  # and the message would then silently go out empty. 'notify' still falls
  # back to a plain message should that happen anyway. 'verify' waits for this
  # job, so a mistyped issue fails the promotion before anything is looked up.
  #
  # The message is a single line of plain text with bare URLs:
  #
  #   name 1.2.3 to <environments> by <login>: <description> (<jira-url>,
  #   <issue-url>, <release-url>)
  #
  # The description, and the Jira and GitHub issue URLs, are left out when not
  # given; the release URL is always there. The deploy automation notifier is
  # a Slack Workflow Builder trigger, which shows its 'message' variable as
  # plain text: link markup such as '<url|text>' would appear literally, while
  # bare URLs are linked by Slack itself. For the same reason no Slack
  # control character needs escaping.
  message:
    name: Compose the Slack message
    # Needs no GitHub token: it only reads its inputs.
    permissions: {}
    runs-on: ubuntu-26.04
    outputs:
      SLACK_MESSAGE: ${{ steps.message.outputs.message }}
    steps:
      - name: Compose the Slack message
        id: message
        env:
          # Passed through the environment rather than interpolated into the
          # script, so that a value typed into a 'workflow_dispatch' form
          # cannot break out of it.
          APPLICATION_NAME: '${{ inputs.APPLICATION_NAME }}'
          APPLICATION_VERSION: '${{ inputs.APPLICATION_VERSION }}'
          DEPLOY_ENVIRONMENTS: '${{ inputs.DEPLOY_CONFIG_REPOSITORY_ENVIRONMENTS }}'
          DISPLAY_NAME: '${{ inputs.APPLICATION_DISPLAY_NAME }}'
          CHANGE_DESCRIPTION: '${{ inputs.CHANGE_DESCRIPTION }}'
          JIRA_ISSUE: '${{ inputs.JIRA_ISSUE }}'
          JIRA_BASE_URL: '${{ inputs.JIRA_BASE_URL }}'
          ISSUE: '${{ inputs.GITHUB_ISSUE }}'
          LEGACY_MESSAGE: '${{ inputs.SLACK_MESSAGE }}'
          ACTOR: '${{ github.triggering_actor }}'
        run: |
          # Values from the dispatch form are printed shell-quoted in errors, so
          # that a line break in one cannot start a workflow command in the log.
          quote() {
            printf '%q' "$1"
          }
          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            printf '%s' "${s%"${s##*[![:space:]]}"}"
          }
          # Collapses line breaks and runs of whitespace into single spaces, so
          # the message stays one line. Unicode line and paragraph separators,
          # NEL and no-break spaces count too, which 'tr' alone, working byte by
          # byte, would let through.
          one_line() {
            trim "$(printf '%s' "$1" \
              | LC_ALL=C sed -e 's/\xe2\x80\xa8/ /g' -e 's/\xe2\x80\xa9/ /g' -e 's/\xc2\x85/ /g' -e 's/\xc2\xa0/ /g' \
              | tr -s '[:space:]' ' ')"
          }
          publish() {
            # Logged with workflow commands suspended, since a legacy message
            # may contain a line starting with '::'.
            local token="end_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
            echo "::stop-commands::${token}"
            printf 'Slack message: %s\n' "$1"
            echo "::${token}::"
            # The delimiter is random for the same reason: a legacy message may
            # span several lines. Plain bash, so that the step runs on any
            # runner.
            local delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
            printf 'message<<%s\n%s\n%s\n' "${delimiter}" "$1" "${delimiter}" >> "${GITHUB_OUTPUT}"
          }

          # The legacy message is posted as it is. The inputs it overrides are
          # not validated: a typo in one must not stop a promotion that does
          # not use it.
          if [ -n "${LEGACY_MESSAGE}" ]; then
            if [ -n "${DISPLAY_NAME}${CHANGE_DESCRIPTION}${JIRA_ISSUE}${ISSUE}" ]; then
              echo "::warning::SLACK_MESSAGE is set and is posted as it is, so APPLICATION_DISPLAY_NAME, CHANGE_DESCRIPTION, JIRA_ISSUE and GITHUB_ISSUE are not used"
            fi
            publish "${LEGACY_MESSAGE}"
            exit 0
          fi

          name="$(one_line "${DISPLAY_NAME}")"
          name="${name:-${APPLICATION_NAME}}"

          # A caller forwarding an empty input of its own passes '', which does
          # not trigger the input's default. Checked whenever given, so that a
          # wrong URL fails before the first issue is linked with it. Only the
          # ASCII characters a plain URL needs are allowed, which keeps the
          # check independent of the locale; '?' and '#' are not among them,
          # since they would put /browse/<key> inside a query or a fragment.
          jira_base_url="$(trim "${JIRA_BASE_URL}")"
          jira_base_url="${jira_base_url:-https://jira.fmi.fi}"
          if [[ "${jira_base_url}" == *://* ]]; then
            scheme="${jira_base_url%%://*}"
            jira_base_url="${scheme,,}://${jira_base_url#*://}"
          fi
          url_re='^https?://[A-Za-z0-9._~:/%@!$*+,;=()-]+$'
          if ! [[ "${jira_base_url}" =~ ${url_re} ]]; then
            echo "::error::JIRA_BASE_URL $(quote "${JIRA_BASE_URL}") is not a URL such as https://jira.fmi.fi"
            exit 1
          fi

          links=()
          # Typed into a form, so surrounding whitespace and a lowercase key are
          # accepted.
          jira_issue="$(trim "${JIRA_ISSUE}")"
          jira_issue="${jira_issue^^}"
          if [ -n "${jira_issue}" ]; then
            if ! [[ "${jira_issue}" =~ ^[A-Z][A-Z0-9_]+-[1-9][0-9]*$ ]]; then
              echo "::error::JIRA_ISSUE $(quote "${JIRA_ISSUE}") is not a Jira issue key such as PAK-1234"
              exit 1
            fi
            links+=("${jira_base_url%/}/browse/${jira_issue}")
          fi

          issue="$(trim "${ISSUE}")"
          if [ -n "${issue}" ]; then
            repository=''
            number=''
            if [[ "${issue}" =~ ^#?([1-9][0-9]*)$ ]]; then
              repository="${GITHUB_REPOSITORY}"
              number="${BASH_REMATCH[1]}"
            elif [[ "${issue,,}" == "${GITHUB_SERVER_URL,,}/"* ]]; then
              # The server prefix is cut off rather than matched in a regex
              # built from it, which would need its '.' escaped. A trailing '/'
              # or '#comment' anchor, as copied from a browser, is dropped.
              path="${issue:$(( ${#GITHUB_SERVER_URL} + 1 ))}"
              path="${path%%#*}"
              path="${path%/}"
              # Owners start with a letter or digit. Repository names may start
              # with '.', as '.github' does, but cannot be '.' or '..'.
              if [[ "${path}" =~ ^([A-Za-z0-9][A-Za-z0-9_.-]*/([A-Za-z0-9_.-]+))/issues/([1-9][0-9]*)$ ]] \
                && [ "${BASH_REMATCH[2]}" != '.' ] && [ "${BASH_REMATCH[2]}" != '..' ]; then
                repository="${BASH_REMATCH[1]}"
                number="${BASH_REMATCH[3]}"
              fi
            fi
            if [ -z "${number}" ]; then
              echo "::error::GITHUB_ISSUE $(quote "${ISSUE}") is neither an issue number nor an issue URL on ${GITHUB_SERVER_URL}"
              exit 1
            fi
            links+=("${GITHUB_SERVER_URL}/${repository}/issues/${number}")
          fi

          # The release page is always linked, last; GitHub shows it for a bare
          # tag too.
          links+=("${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${APPLICATION_VERSION}")

          message="${name} ${APPLICATION_VERSION} to $(one_line "${DEPLOY_ENVIRONMENTS}") by ${ACTOR}"
          description="$(one_line "${CHANGE_DESCRIPTION}")"
          if [ -n "${description}" ]; then
            message+=": ${description}"
          fi
          joined="${links[0]}"
          for link in "${links[@]:1}"; do
            joined+=", ${link}"
          done
          message+=" (${joined})"
          publish "${message}"

  verify:
    name: Verify the version has been published
    needs: message
    runs-on: ubuntu-26.04
    outputs:
      SLACK_ENABLED: ${{ steps.slack.outputs.enabled }}
    env:
      # Passed through the environment rather than interpolated into the shell
      # commands below, so that a version typed into a 'workflow_dispatch' form
      # cannot break out of the script.
      APPLICATION_NAME: '${{ inputs.APPLICATION_NAME }}'
      APPLICATION_VERSION: '${{ inputs.APPLICATION_VERSION }}'
      DEPLOY_ENVIRONMENTS: '${{ inputs.DEPLOY_CONFIG_REPOSITORY_ENVIRONMENTS }}'
      IMAGE_REFERENCE: '${{ inputs.IMAGE_REGISTRY }}/${{ inputs.IMAGE_REGISTRY_NAMESPACE }}/${{ inputs.APPLICATION_NAME }}:${{ inputs.IMAGE_TAG_PREFIX }}${{ inputs.APPLICATION_VERSION }}${{ inputs.IMAGE_TAG_SUFFIX }}'
      HELM_CHART_REFERENCE: "oci://${{ inputs.IMAGE_REGISTRY }}/${{ inputs.IMAGE_REGISTRY_NAMESPACE }}/${{ inputs.HELM_CHART_NAME || format('{0}-chart', inputs.APPLICATION_NAME) }}"
    steps:
      - name: Validate SemVer
        run: |
          echo "Application version: ${APPLICATION_VERSION}"
          # Regex from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
          # minus its optional build-metadata group: '+' cannot appear in a
          # container image tag, so such a version was never published whole and
          # the registry lookups below would fail on the malformed reference
          # with a misleading "has it been built?".
          if printf '%s' "${APPLICATION_VERSION}" | grep --silent --perl-regexp '^(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$'; then
            echo "Version matches the SemVer format"
          else
            echo "::error::Version '${APPLICATION_VERSION}' is not SemVer without build metadata, which is what an image tag can carry"
            exit 1
          fi

      - name: Registry login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: '${{ inputs.IMAGE_REGISTRY }}'
          username: '${{ secrets.IMAGE_REGISTRY_USER }}'
          password: '${{ secrets.IMAGE_REGISTRY_TOKEN }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image is checked first: it is what actually runs in the cluster, and
      # a version that was never built must not reach GitOps.
      - name: Verify the container image exists
        run: |
          echo "Looking up ${IMAGE_REFERENCE}"
          if ! docker buildx imagetools inspect "${IMAGE_REFERENCE}"; then
            echo "::error::No container image '${IMAGE_REFERENCE}' in the registry. Has version ${APPLICATION_VERSION} been built?"
            exit 1
          fi

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '${{ inputs.HELM_VERSION }}'

      - name: Verify the Helm chart exists
        env:
          IMAGE_REGISTRY: '${{ inputs.IMAGE_REGISTRY }}'
          IMAGE_REGISTRY_USER: '${{ secrets.IMAGE_REGISTRY_USER }}'
          IMAGE_REGISTRY_TOKEN: '${{ secrets.IMAGE_REGISTRY_TOKEN }}'
        run: |
          printf '%s' "${IMAGE_REGISTRY_TOKEN}" | \
            helm registry login "${IMAGE_REGISTRY}" --username "${IMAGE_REGISTRY_USER}" --password-stdin
          echo "Looking up ${HELM_CHART_REFERENCE} version ${APPLICATION_VERSION}"
          if ! helm show chart "${HELM_CHART_REFERENCE}" --version "${APPLICATION_VERSION}"; then
            echo "::error::No Helm chart '${HELM_CHART_REFERENCE}' version ${APPLICATION_VERSION} in the registry. Has version ${APPLICATION_VERSION} been built?"
            exit 1
          fi
          helm registry logout "${IMAGE_REGISTRY}" || true

      - name: Check whether Slack notifications are configured
        id: slack
        env:
          # The 'secrets' context cannot be read from a job-level 'if:', so
          # whether the webhook is available is resolved here and passed on as a
          # job output. Only the true/false verdict leaves this step.
          SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}'
        run: |
          if [ -n "${SLACK_WEBHOOK_URL}" ]; then
            echo 'SLACK_WEBHOOK_URL is set, the promotion will be announced in Slack'
            echo 'enabled=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'SLACK_WEBHOOK_URL is not set, skipping the Slack notification'
            echo 'enabled=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Summary
        run: |
          {
            echo "### Promoting ${APPLICATION_NAME} ${APPLICATION_VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Application | \`${APPLICATION_NAME}\` |"
            echo "| Version | \`${APPLICATION_VERSION}\` |"
            echo "| Environments | \`${DEPLOY_ENVIRONMENTS}\` |"
            echo "| Image | \`${IMAGE_REFERENCE}\` |"
            echo "| Helm chart | \`${HELM_CHART_REFERENCE}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  update-openshift-app-version:
    name: Update version in OpenShift GitOps
    needs: verify
    uses: fmidev/.github/.github/workflows/update-openshift-application-version.yaml@0.5.0
    with:
      APPLICATION_NAME: ${{ inputs.APPLICATION_NAME }}
      APPLICATION_VERSION: ${{ inputs.APPLICATION_VERSION }}
      HELM_CHART_KEY: ${{ inputs.HELM_CHART_KEY || inputs.HELM_CHART_NAME }}
      IMAGE_TAG_PREFIX: ${{ inputs.IMAGE_TAG_PREFIX }}
      IMAGE_TAG_SUFFIX: ${{ inputs.IMAGE_TAG_SUFFIX }}
      DEPLOY_CONFIG_REPOSITORY: ${{ inputs.DEPLOY_CONFIG_REPOSITORY }}
      DEPLOY_CONFIG_REPOSITORY_SERVER_URL: ${{ inputs.DEPLOY_CONFIG_REPOSITORY_SERVER_URL }}
      DEPLOY_CONFIG_REPOSITORY_BRANCH: ${{ inputs.DEPLOY_CONFIG_REPOSITORY_BRANCH }}
      DEPLOY_CONFIG_REPOSITORY_BASE_PATH: ${{ inputs.DEPLOY_CONFIG_REPOSITORY_BASE_PATH }}
      DEPLOY_CONFIG_REPOSITORY_ENVIRONMENTS: ${{ inputs.DEPLOY_CONFIG_REPOSITORY_ENVIRONMENTS }}
    secrets:
      DEPLOY_CONFIG_REPOSITORY_SSH_PRIVATE_KEY: '${{ secrets.DEPLOY_CONFIG_REPOSITORY_SSH_PRIVATE_KEY }}'

  notify:
    name: Announce in Slack
    needs: [message, verify, update-openshift-app-version]
    # Only announce a promotion that actually landed, and only when a webhook
    # was passed in.
    if: ${{ needs.verify.outputs.SLACK_ENABLED == 'true' }}
    uses: fmidev/.github/.github/workflows/post-to-slack-deploy-automation-notifier.yaml@0.5.0
    with:
      # Should the composed message have been dropped, a plain one without
      # links is posted rather than an empty one.
      slack_message: ${{ needs.message.outputs.SLACK_MESSAGE || inputs.SLACK_MESSAGE || format('{0} {1} to {2} by {3} ({4}/{5}/releases/tag/{1})', inputs.APPLICATION_DISPLAY_NAME || inputs.APPLICATION_NAME, inputs.APPLICATION_VERSION, inputs.DEPLOY_CONFIG_REPOSITORY_ENVIRONMENTS, github.triggering_actor, github.server_url, github.repository) }}
    secrets:
      SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}'
