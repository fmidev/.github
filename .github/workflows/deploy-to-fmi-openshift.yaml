name: Build and Deploy to OpenShift

# DEPRECATED. Kept only so that repositories still pinned to it keep working.
#
# This is the original single-job pipeline: it bumps a tag by itself with a
# third-party action, builds with Buildah, publishes the chart, and edits the
# GitOps repository, all in one job with no verification between the stages. It
# has been replaced by 'openshift-deploy.yaml', which does the same work in
# separate reusable workflows, validates the version, and can be paired with
# 'openshift-promote.yaml' for environments that must not deploy automatically.
#
# No repository in the fmidev organisation calls this workflow any more. It is
# scheduled for removal in the next major release; migrate to
# 'openshift-deploy.yaml' and drive the version from a tag push instead of
# letting the workflow invent one.
#
# Its actions are SHA-pinned like everything else here, but it is otherwise
# unmaintained: it is not covered by the improvements made to the workflows
# around it.

on:
  workflow_call:
    inputs:
      APPLICATION_NAME:
        default: '${{ github.event.repository.name }}'
        required: false
        type: string
      IMAGE_REGISTRY:
        default: 'quay.io'
        required: false
        type: string
      IMAGE_REGISTRY_NAMESPACE:
        default: 'fmi'
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY:
        default: 'fmidev/openshift-apps-gitops'
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY_BRANCH:
        default: 'main'
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY_BASE_PATH:
        default: '.'
        required: false
        type: string
      DEPLOY_CONFIG_REPOSITORY_ENVIRONMENT:
        default: 'dev'
        required: false
        type: string
    secrets:
      IMAGE_REGISTRY_USER:
        required: true
      IMAGE_REGISTRY_TOKEN:
        required: true
      DEPLOY_CONFIG_REPOSITORY_SSH_PRIVATE_KEY:
        required: true

jobs:
  update-versions:
    name: Update Versions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Push to Registry action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"

      - name: Generate tag
        id: generate_tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          DEFAULT_BUMP: 'patch'
          RELEASE_BRANCHES: 'main'
          INITIAL_VERSION: '0.0.0'

      - name: Registry login
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: '${{ inputs.IMAGE_REGISTRY }}'
          username: '${{ secrets.IMAGE_REGISTRY_USER }}'
          password: '${{ secrets.IMAGE_REGISTRY_TOKEN }}'

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: '${{ inputs.APPLICATION_NAME }}'
          layers: false
          # buildah-build v3 changed the default to 'true'; kept at the v2
          # default so the published image layout does not change.
          squash: false
          tags: '${{ steps.generate_tag.outputs.new_tag }}'
          dockerfiles: |
            ./Dockerfile

      - name: Push to registry
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          image: '${{ steps.build_image.outputs.image }}'
          tags: '${{ steps.build_image.outputs.tags }}'
          registry: '${{ inputs.IMAGE_REGISTRY }}/${{ inputs.IMAGE_REGISTRY_NAMESPACE }}'
          extra-args: |
            --disable-content-trust
      - name: Echo outputs
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.13.3'

      - name: Publish Helm chart
        run: |
          cd conf/helm
          helm version
          helm registry login ${{ inputs.IMAGE_REGISTRY }} --username ${{ secrets.IMAGE_REGISTRY_USER }} --password ${{ secrets.IMAGE_REGISTRY_TOKEN }}
          helm dependency build
          helm package . --version ${{ steps.generate_tag.outputs.new_tag }}
          helm push ./*.tgz 'oci://${{ inputs.IMAGE_REGISTRY }}/${{ inputs.IMAGE_REGISTRY_NAMESPACE }}'

      - name: Install SSH Client
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: '${{ secrets.DEPLOY_CONFIG_REPOSITORY_SSH_PRIVATE_KEY }}'

      - name: Check out remote code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: '${{ inputs.DEPLOY_CONFIG_REPOSITORY }}'
          ssh-key: '${{ secrets.DEPLOY_CONFIG_REPOSITORY_SSH_PRIVATE_KEY }}'
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will fail to push refs to dest repo

      - name: Update Helm chart
        run: |
          cd '${{ inputs.DEPLOY_CONFIG_REPOSITORY_BASE_PATH }}/${{ inputs.APPLICATION_NAME }}/${{ inputs.DEPLOY_CONFIG_REPOSITORY_ENVIRONMENT }}'
          yq -i '.dependencies[0].version = "${{ steps.build_image.outputs.tags }}"' Chart.yaml
          yq -i '.version = "${{ steps.build_image.outputs.tags }}"' Chart.yaml
          yq -i '."${{ inputs.APPLICATION_NAME }}-chart".application.deployment.image.tag = "${{ steps.build_image.outputs.tags }}"' values.yaml

      - name: Commit files
        env:
          COMMIT_AUTHOR_NAME: '${{ github.event.head_commit.author.name || github.actor }}'
          COMMIT_AUTHOR_EMAIL: "${{ github.event.head_commit.author.email || format('{0}@users.noreply.github.com', github.actor) }}"
        run: |
          git config --local user.email "${COMMIT_AUTHOR_EMAIL}"
          git config --local user.name "${COMMIT_AUTHOR_NAME} (via automation)"
          git status
          git pull
          git diff
          git add .
          git commit --all --message="Update '${{ inputs.APPLICATION_NAME }}' version to '${{ steps.build_image.outputs.tags }}'"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          ssh-key: '${{ secrets.DEPLOY_CONFIG_REPOSITORY_SSH_PRIVATE_KEY }}'
          repository-name: '${{ inputs.DEPLOY_CONFIG_REPOSITORY }}'
          branch: '${{ inputs.DEPLOY_CONFIG_REPOSITORY_BRANCH }}'
          target-folder: '${{ inputs.DEPLOY_CONFIG_REPOSITORY_BASE_PATH }}/${{ inputs.APPLICATION_NAME }}/${{ inputs.DEPLOY_CONFIG_REPOSITORY_ENVIRONMENT }}'
          folder: '${{ inputs.DEPLOY_CONFIG_REPOSITORY_BASE_PATH }}/${{ inputs.APPLICATION_NAME }}/${{ inputs.DEPLOY_CONFIG_REPOSITORY_ENVIRONMENT }}'
          git-config-email: '${{ github.event.head_commit.author.email }}'
          git-config-name: '${{ github.event.head_commit.author.name }} (via automation)'
          commit-message: "Update '${{ inputs.APPLICATION_NAME }}' version to '${{ steps.build_image.outputs.tags }}'\n\n${{ github.event.commits[0].message }}"
