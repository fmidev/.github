name: Deploy repository using rsync

# Copies the calling repository to a remote host over rsync. Used by the static
# sites that are served straight from a filesystem rather than from a container.

on:
  workflow_call:
    inputs:
      remote_user:
        description: 'The remote user to deploy to'
        required: true
        type: string
      remote_host:
        description: 'The remote host to deploy to'
        required: true
        type: string
      remote_directory:
        description: 'The remote directory to deploy to'
        required: true
        type: string
      source_directory:
        description: 'The source directory to sync'
        required: false
        type: string
        default: './'
      target_chmod:
        description: 'The chmod options for rsync, e.g. "D700,F600"'
        required: false
        type: string
        default: 'D700,F600'
    secrets:
      DEPLOY_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The key is written to a file in the workspace and removed in the final
      # step, rather than added to an ssh-agent: the agent would have to be
      # started in one step and reached from another, and the environment does
      # not survive between steps.
      - name: Install the deploy key and trust the target host
        env:
          DEPLOY_KEY: '${{ secrets.DEPLOY_KEY }}'
          REMOTE_HOST: '${{ inputs.remote_host }}'
        run: |
          umask 077
          printf '%s\n' "${DEPLOY_KEY}" > deploy-key
          chmod 600 deploy-key

          mkdir --parents ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Add the target host keys to known_hosts if not already found
          grep --fixed-strings --silent "${REMOTE_HOST}" ~/.ssh/known_hosts || \
            ssh-keyscan "${REMOTE_HOST}" 2>&1 | grep --invert-match '^#' | sort -u >> ~/.ssh/known_hosts

          # Add the target host keys by IP to known_hosts if not already found
          ip_address=$(nslookup "${REMOTE_HOST}" | awk '/^Address: / { print $2 }' | head -n 1)
          echo "Resolved IP address ${ip_address} for ${REMOTE_HOST}"
          grep --fixed-strings --silent "${ip_address}" ~/.ssh/known_hosts || \
            ssh-keyscan "${ip_address}" 2>&1 | grep --invert-match '^#' | sort -u >> ~/.ssh/known_hosts

      # TODO: Add rsync exclude/exclude-from configuration option using the GitHub Workflow input variable
      - name: Deploy with rsync
        env:
          SOURCE_DIRECTORY: '${{ inputs.source_directory }}'
          TARGET_CHMOD: '${{ inputs.target_chmod }}'
          REMOTE_USER: '${{ inputs.remote_user }}'
          REMOTE_HOST: '${{ inputs.remote_host }}'
          REMOTE_DIRECTORY: '${{ inputs.remote_directory }}'
        run: |
          rsync --rsh="ssh -i deploy-key" \
            --archive --verbose --delete \
            --chmod="${TARGET_CHMOD}" \
            "${SOURCE_DIRECTORY}" "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_DIRECTORY}" \
            --exclude '.git/' --exclude '.github/' --exclude 'deploy-key'

      - name: Clean up
        if: always()
        run: |
          rm --force deploy-key
